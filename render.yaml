services:
  - type: web
    name: student-assessment-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"
      - key: DEFAULT_SCHOOL_NAME
        value: "Delhi Public Model School"
      - key: DEFAULT_LLM_PROVIDER
        value: "groq"
      - key: DEFAULT_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
