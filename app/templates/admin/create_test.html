{% extends "base.html" %}

{% block title %}Create Assessment &bull; Admin{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 1.5rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div class="page-header" style="margin-bottom: 1.5rem;">
      <div>
        <h1 class="page-title">Create New Assessment</h1>
        <p class="page-subtitle">Configure test metadata before uploading question CSV</p>
      </div>
      <div>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary btn-sm">&larr; Back</a>
      </div>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="name" class="form-label">Assessment Title *</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="e.g. Mathematics Mid-Term Assessment" 
          required
          autofocus
        >
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label for="subject" class="form-label">Subject *</label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            class="form-control" 
            placeholder="e.g. Mathematics" 
            required
          >
        </div>

        <div class="form-group">
          <label for="class_name" class="form-label">Target Class *</label>
          <select id="class_name" name="class_name" class="form-control" required>
            <option value="" disabled selected>-- Select Class --</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem;">
        <div class="form-group">
          <label for="total_questions" class="form-label">Total Questions (N)</label>
          <input 
            type="number" 
            id="total_questions" 
            name="total_questions" 
            class="form-control" 
            value="20" 
            min="1" 
            max="150"
            required
          >
          <small style="color: var(--muted); font-size: 0.78rem;">Default: 20 questions.</small>
        </div>

        <div class="form-group">
          <label for="duration_min" class="form-label">Duration (Minutes)</label>
          <input 
            type="number" 
            id="duration_min" 
            name="duration_min" 
            class="form-control" 
            value="30" 
            min="1" 
            max="180"
            required
          >
          <small style="color: var(--muted); font-size: 0.78rem;">Server-side countdown timer.</small>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem;">
        <div class="form-group">
          <label for="marks_per_q" class="form-label">Marks Per Question</label>
          <input 
            type="number" 
            step="0.25" 
            id="marks_per_q" 
            name="marks_per_q" 
            class="form-control" 
            value="1.0" 
            min="0.25"
            required
          >
        </div>

        <div class="form-group">
          <label for="negative_marking" class="form-label">Negative Marking (Per Wrong Answer)</label>
          <input 
            type="number" 
            step="0.05" 
            id="negative_marking" 
            name="negative_marking" 
            class="form-control" 
            value="0.0" 
            min="0"
          >
          <small style="color: var(--muted); font-size: 0.78rem;">0 = No negative marking.</small>
        </div>
      </div>

      <div style="margin-top: 1rem; background: #f8fafc; border: 1px solid var(--border); padding: 1rem; border-radius: var(--radius-sm);">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-bottom: 0.5rem;">
          <input type="checkbox" name="shuffle" value="1" checked>
          <span>Shuffle questions and options for each student (Cheating Guard)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer;">
          <input type="checkbox" name="allow_reattempt" value="1">
          <span>Allow students to re-attempt this assessment if needed</span>
        </label>
      </div>

      <div style="margin-top: 1.75rem; display: flex; justify-content: flex-end; gap: 10px;">
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          Save & Proceed to Upload CSV &rarr;
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
