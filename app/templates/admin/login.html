{% extends "base.html" %}

{% block title %}Teacher / Admin Login{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-block; background: var(--primary-light); color: var(--primary); padding: 12px 16px; border-radius: 50%; font-size: 1.8rem; margin-bottom: 0.75rem;">
        🔒
      </div>
      <h1 class="page-title" style="font-size: 1.6rem;">Admin Sign In</h1>
      <p class="page-subtitle">Access test builder, question upload, and analytics</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="prince" 
          required 
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <div style="margin-top: 1.75rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
          Sign In to Dashboard &rarr;
        </button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--muted);">
      Default Teacher Credentials: <code>prince</code> / <code>tarunsirkijai</code>
    </div>
  </div>
</div>
{% endblock %}
